<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DB Craft Help</title>
  <style>
    :root {
      --bg: #eef4fb;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-border: rgba(24, 57, 118, 0.12);
      --text: #142235;
      --subtext: #5a697c;
      --primary: #0f62fe;
      --primary-soft: rgba(15, 98, 254, 0.12);
      --accent: #0f9d8a;
      --shadow: 0 20px 60px rgba(16, 32, 64, 0.14);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 18px;
      --radius-sm: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(15, 98, 254, 0.18), transparent 34%),
        radial-gradient(circle at top right, rgba(15, 157, 138, 0.14), transparent 28%),
        linear-gradient(180deg, #f9fbfe 0%, var(--bg) 100%);
    }

    code {
      padding: 0 6px;
      border-radius: 8px;
      background: rgba(17, 31, 56, 0.08);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 0.95em;
    }

    .page {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 52px;
    }

    .hero {
      padding: 34px;
      border-radius: 30px;
      color: #fff;
      background: linear-gradient(135deg, #112548 0%, #1846a7 54%, #0f62fe 100%);
      box-shadow: var(--shadow);
    }

    .hero-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero-brand {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.14);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.05;
    }

    .hero p {
      margin: 10px 0 0;
      max-width: 760px;
      color: rgba(255, 255, 255, 0.84);
      line-height: 1.75;
      font-size: 15px;
    }

    .lang-pill {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.9);
      white-space: nowrap;
    }

    .hero-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .hero-card {
      padding: 16px 18px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.12);
    }

    .hero-card strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .hero-card span {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      font-size: 13px;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      margin-top: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .section {
      padding: 24px;
    }

    .section h2 {
      margin: 0 0 16px;
      font-size: 23px;
    }

    .steps,
    .feature-list,
    .shortcut-list,
    .faq-list {
      display: grid;
      gap: 12px;
    }

    .step,
    .feature-item,
    .shortcut-item,
    .faq-item {
      padding: 16px;
      border-radius: var(--radius-md);
      background: #fff;
      border: 1px solid rgba(17, 35, 68, 0.07);
    }

    .step {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 14px;
    }

    .step-no {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: var(--radius-sm);
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }

    .step h3,
    .feature-item h3,
    .shortcut-item h3,
    .faq-item h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .step p,
    .feature-item p,
    .shortcut-item p,
    .faq-item p {
      margin: 0;
      color: var(--subtext);
      line-height: 1.75;
      font-size: 14px;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      background: #edf4ff;
      color: #1f54ba;
      font-size: 12px;
      font-weight: 600;
    }

    .shortcut-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      margin-right: 10px;
      padding: 6px 10px;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .note {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(15, 157, 138, 0.11), rgba(15, 98, 254, 0.08));
      color: var(--text);
      font-size: 14px;
      line-height: 1.8;
    }

    .footer-note {
      margin-top: 18px;
      padding: 18px 22px;
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--surface-border);
      box-shadow: var(--shadow);
      color: var(--subtext);
      line-height: 1.8;
      font-size: 14px;
    }

    .footer-note strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 16px;
    }

    @media (max-width: 860px) {
      .page {
        width: min(100%, calc(100% - 20px));
        padding-top: 18px;
        padding-bottom: 28px;
      }

      .hero,
      .section {
        padding: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <main class="page">
    <section class="hero">

      <div class="hero-cards" id="heroCards"></div>
    </section>

    <section class="grid">

        <div class="note" id="quickStartNote"></div>
      </div>

      <div class="card section">

      </div>
    </section>

    <section class="grid">
      <div class="card section">

      </div>

      <div class="card section">
        <h2 id="faqTitle"></h2>
        <div class="faq-list" id="faqList"></div>
      </div>
    </section>

    <section class="footer-note">
      <strong id="licenseTitle"></strong>
      <div id="licenseText"></div>
    </section>
  </main>

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getCurrentLanguage() {
      const params = new URLSearchParams(window.location.search);
      const fromQuery = params.get("lang");
      if (SUPPORTED_LANGUAGES.includes(fromQuery)) return fromQuery;
      try {
        const fromStorage = String(localStorage.getItem(MANUAL_LANGUAGE_KEY) || "").trim();
        if (SUPPORTED_LANGUAGES.includes(fromStorage)) return fromStorage;
      } catch {
        // ignore localStorage errors
      }
      return DEFAULT_LANGUAGE;
    }

    function renderCards(container, items) {
      container.innerHTML = items.map((item) => `
        <article class="hero-card">
          <strong>${escapeHtml(item.title)}</strong>
          <span>${escapeHtml(item.text)}</span>
        </article>
      `).join("");
    }

    function renderSteps(container, items) {
      container.innerHTML = items.map((item, index) => `
        <article class="step">
          <div class="step-no">${index + 1}</div>
          <div>
            <h3>${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.text)}</p>
            ${Array.isArray(item.chips) && item.chips.length ? `
              <div class="chip-row">
                ${item.chips.map((chip) => `<span class="chip">${escapeHtml(chip)}</span>`).join("")}
              </div>
            ` : ""}
          </div>
        </article>
      `).join("");
    }

    function renderFeatureList(container, items) {
      container.innerHTML = items.map((item) => `
        <article class="feature-item">
          <h3>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.text)}</p>
        </article>
      `).join("");
    }

    function renderShortcutList(container, items) {
      container.innerHTML = items.map((item) => `
        <article class="shortcut-item">
          <h3><span class="shortcut-key">${escapeHtml(item.key)}</span>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.text)}</p>
        </article>
      `).join("");
    }

    function renderFaqList(container, items) {
      container.innerHTML = items.map((item) => `
        <article class="faq-item">
          <h3>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.text)}</p>
        </article>
      `).join("");
    }

    function renderManual() {
      const language = getCurrentLanguage();
      const copy = MANUAL_I18N[language] || MANUAL_I18N[DEFAULT_LANGUAGE];

      document.documentElement.lang = language;
      document.title = copy.pageTitle;
      document.getElementById("languagePill").textContent = copy.languageLabel;
      document.getElementById("heroTitle").textContent = copy.heroTitle;
      document.getElementById("heroSubtitle").textContent = copy.heroSubtitle;
      document.getElementById("quickStartTitle").textContent = copy.quickStartTitle;
      document.getElementById("quickStartNote").textContent = copy.quickStartNote;
      document.getElementById("featureTitle").textContent = copy.featureTitle;
      document.getElementById("shortcutTitle").textContent = copy.shortcutTitle;
      document.getElementById("faqTitle").textContent = copy.faqTitle;
      document.getElementById("licenseTitle").textContent = copy.licenseTitle;
      document.getElementById("licenseText").textContent = copy.licenseText;

      renderCards(document.getElementById("heroCards"), copy.heroCards);
      renderSteps(document.getElementById("quickStartList"), copy.quickStartSteps);
      renderFeatureList(document.getElementById("featureList"), copy.features);
      renderShortcutList(document.getElementById("shortcutList"), copy.shortcuts);
      renderFaqList(document.getElementById("faqList"), copy.faqs);
    }

    renderManual();
  </script>
